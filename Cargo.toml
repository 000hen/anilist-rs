[workspace]
resolver = "3"
members = [
    "anilist-core",
    "anilist-iced",
    "anilist-source",
    "anilist-youranimes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Muisnow <me@muisnowdevs.one>"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
