[workspace]
resolver = "3"
members = [
  "anilist-core",
  "anilist-ffi",
  "anilist-iced",
  "anilist-nextjs",
  "anilist-source",
  "anilist-youranimes",
  "uniffi-bindgen",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
anilist-core = { path = "anilist-core" }
anilist-nextjs = { path = "anilist-nextjs" }
anilist-source = { path = "anilist-source" }
anilist-youranimes = { path = "anilist-youranimes" }
async-stream = "0.3"
cbindgen = "0.29"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures = "0.3.34"
futures-timer = "3"
iana-time-zone = "0.1"
iced = { version = "0.14.0", features = ["image", "tokio"] }
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
uniffi = { version = "0.32.0", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "z"
debug = false
strip = true
lto = true
panic = "abort"
codegen-units = 1
