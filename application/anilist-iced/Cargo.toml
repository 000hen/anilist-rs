[package]
name = "anilist-iced"
version = "0.0.1"
edition = "2024"

# A standalone workspace keeps desktop-only dependencies out of the library workspace.
[workspace]

[[bin]]
name = "anilist"
path = "src/main.rs"

[dependencies]
anilist-core = { path = "../../crates/anilist-core", default-features = false, features = ["clock"] }
anilist-source = { path = "../../crates/anilist-source" }
anilist-youranimes = { path = "../../crates/anilist-youranimes", default-features = false, features = ["http", "system-timezone"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
iced = { version = "0.14.0", features = ["image", "tokio"] }
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
debug = false
strip = true
lto = true
panic = "abort"
codegen-units = 1
